<!DOCTYPE html>
<html>
<head><title>System Error</title></head>
<body bgcolor="#F0F0F0" style="margin: 0;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#E8E8E8">
    <tr>
        <td style="padding: 8px 15px;">
            <font face="Arial" size="2" color="#003366"><b>CreditUnion Core</b> &mdash; Error</font>
        </td>
    </tr>
</table>
<hr size="1" color="#CCCCCC" noshade>

<table width="95%" align="center" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding: 40px 0;" align="center">
            <table cellpadding="15" cellspacing="0" border="0" bgcolor="#FFEEEE" width="500"
                   style="border: 1px solid #CC0000;">
                <tr>
                    <td align="center">
                        <font face="Arial" size="3" color="#CC0000"><b>System Error</b></font>
                        <br><br>
                        <font face="Arial" size="2" color="#333333">
                            {{ message }}
                        </font>
                        <br><br>
                        <table cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td bgcolor="#003366" style="padding: 5px 20px; cursor: pointer;"
                                    onclick="window.location.href='/home'">
                                    <font face="Arial" size="2" color="#FFFFFF"><b>Return to Home</b></font>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
